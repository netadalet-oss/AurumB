plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aurum.bistterminal8'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Must stay identical to the installed 2026-09-17 APK so Android performs an in-place
        // update and preserves WebView/IndexedDB/SharedPreferences application data.
        applicationId 'com.aurum.nextrevised09'
        minSdk 26
        targetSdk 35
        versionCode 123
        versionName '2.0.0-r38-separate-economic'
    }

    buildTypes {
        release {
            // Release-compatible compile/resource/manifest validation is required in CI.
            // Final installable signing is performed by the persistent-keystore CI step.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
