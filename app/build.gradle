plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.aurum.bistterminal8'
    compileSdk 35

    compileOptions { coreLibraryDesugaringEnabled true;
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Must stay identical to the installed 2026-09-17 APK so Android performs an in-place
        // update and preserves WebView/IndexedDB/SharedPreferences application data.
        applicationId 'com.aurum.nextrevised09'
        minSdk 26
        targetSdk 35
        versionCode 123
        versionName '2.0.0-r38-separate-economic'
    }

    buildTypes {
        release {
            // Keep release unsigned. CI aligns and signs this exact artifact with the
            // persistent production/update key after all compile/lint checks pass.
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}


kapt { arguments { arg("room.schemaLocation", "$projectDir/schemas") } }
