name: Legacy AurumB Android 35 Smoke
on:
  push:
    branches: [ verify/legacyb-android35-smoke-20261008 ]
jobs:
  android35-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build verified Legacy debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Android 35 foreground, offline and restart smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          script: |
            set -e
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.aurum.nextrevised09/com.aurum.bistterminal8.MainActivity
            sleep 15
            adb shell pidof com.aurum.nextrevised09 >/dev/null
            adb shell am force-stop com.aurum.nextrevised09
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am start -W -n com.aurum.nextrevised09/com.aurum.bistterminal8.MainActivity
            sleep 10
            adb shell pidof com.aurum.nextrevised09 >/dev/null
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -W -n com.aurum.nextrevised09/com.aurum.bistterminal8.MainActivity
            sleep 6
            adb shell pidof com.aurum.nextrevised09 >/dev/null
            ! adb logcat -d | grep -A9 -B3 'FATAL EXCEPTION' | grep -q 'Process: com.aurum.nextrevised09'
