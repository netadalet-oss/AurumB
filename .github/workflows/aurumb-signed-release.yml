name: AurumB Signed Release
# Production artifacts are explicitly dispatched only after CI and upgrade preservation
# checks pass; merging source alone must never implicitly publish an APK.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurumb-signed-release
  cancel-in-progress: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AURUM_RELEASE_STORE_PASSWORD: ${{ secrets.AURUM_RELEASE_STORE_PASSWORD }}
      AURUM_RELEASE_KEY_ALIAS: ${{ secrets.AURUM_RELEASE_KEY_ALIAS }}
      AURUM_RELEASE_KEY_PASSWORD: ${{ secrets.AURUM_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify transfer safety before signing
        run: |
          node --check app/src/main/assets/runtime.js
          node --test tools/transfer-integrity.test.mjs tools/transfer-progress-safe.test.mjs tools/aurumb-webview-freeze.test.mjs
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.AURUM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$AURUM_RELEASE_STORE_PASSWORD"
          test -n "$AURUM_RELEASE_KEY_ALIAS"
          test -n "$AURUM_RELEASE_KEY_PASSWORD"
      - name: Materialize signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURUM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurum-release.jks"
          echo "AURUM_RELEASE_KEYSTORE=$RUNNER_TEMP/aurum-release.jks" >> "$GITHUB_ENV"
      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed APK and AAB
        run: gradle --no-daemon :app:packageVerifiedRelease
      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signed-release-signature.txt
          # Fail closed unless this signer matches the APK currently installed on devices.
          # SHA-256 DER certificate digest verified directly from uploaded base.apk (APK v2).
          EXPECTED_CERT_SHA256="75eb737446685179ac02b4c17eb4b29c4b978933971e82309f2a1886230047a1"
          ACTUAL_CERT_SHA256="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' signed-release-signature.txt | tr -d ':')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::The release key does not match the installed AurumB signing certificate; in-place update is unsafe."
            exit 1
          }
          APK_BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='io.aurum.next.aurumb' versionCode='4' versionName='1.0.3-cleanroom-stability'" <<< "$APK_BADGING"
          # Android's versionCode=4 is separate from the legacy in-app .aurum ABI code 123.
          sha256sum "$APK" app/build/outputs/bundle/release/*.aab | tee signed-release-checksums.sha256
          {
            echo "git_sha=$GITHUB_SHA"
            echo "git_ref=$GITHUB_REF"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "apk=$APK"
          } > signed-release-provenance.txt
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            signed-release-signature.txt
            signed-release-checksums.sha256
            signed-release-provenance.txt
          if-no-files-found: error
          retention-days: 30
      - name: Destroy materialized signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aurum-release.jks"
