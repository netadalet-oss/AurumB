name: Runtime Acceptance
on:
  push:
    branches: [ stabilization-runtime-acceptance ]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Static runtime invariants
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/rev20-final-rules.js
          ! grep -q "indicatorPromise=refreshMarketIndicators()" app/src/main/assets/runtime.js
          ! grep -q "indicatorPromise=refreshMarketIndicators" app/src/main/assets/runtime.js
          test "$(grep -F "Promise.resolve(cachedMarketIndicators())," app/src/main/assets/runtime.js | wc -l)" -eq 2
          grep -Fq "Promise.allSettled([refreshMarketIndicators(),refreshAurumFinancePortal(true)])" app/src/main/assets/runtime.js
          ! grep -Fq "refreshAurumFinancePortal(false).finally(schedule)" app/src/main/assets/runtime.js
          grep -Fq "setTimeout(()=>{try{paint(load())}catch{}},0)" app/src/main/assets/runtime.js
          grep -Fq "dbGet('meta','lastSuccessfulSync')" app/src/main/assets/runtime.js
          grep -Fq "activeSnapshot?.transferredAt||activeSnapshot?.completedAt" app/src/main/assets/runtime.js
          grep -Fq "MARKET_30M_OWNER" app/src/main/assets/runtime.js
          grep -Fq "REV20.40_DIRECT_PROVIDER" app/src/main/assets/runtime.js
          grep -Fq "GENELPARA_DIRECT" app/src/main/assets/runtime.js
          grep -Fq "async function marketRequest" app/src/main/assets/runtime.js
          grep -Fq "const complete=k=>fields[k]?.value!=null&&Number.isFinite(Number(fields[k]?.changePct))" app/src/main/assets/runtime.js
          grep -Fq "const missing=covers.filter(k=>!complete(k))" app/src/main/assets/runtime.js
          grep -Fq "['ALTINKAYNAK',['USDTRY','EURTRY','GRAMTRY','GOLDUSD'],altinkaynak]" app/src/main/assets/runtime.js
          grep -Fq "['THEUNAT',['XU100','USDTRY','EURTRY','GOLDUSD'],theunat]" app/src/main/assets/runtime.js
          grep -Fq "['BISTCANLI',['XU100','USDTRY','EURTRY','GRAMTRY','GOLDUSD'],bistCanli]" app/src/main/assets/runtime.js
          grep -Fq "idle(()=>globalThis.refreshMarketIndicators?.())" app/src/main/assets/runtime.js
          grep -Fq "native?.canHandle?.(url)" app/src/main/assets/runtime.js
          grep -Fq "'api.genelpara.com'" app/src/main/assets/native-market-http.js
          grep -Fq "'static.altinkaynak.com'" app/src/main/assets/native-market-http.js
          grep -Fq "async function altinkaynak" app/src/main/assets/runtime.js
          grep -Fq "for(const k of KEYS)if(!fields[k]&&partial[k])fields[k]=partial[k]" app/src/main/assets/runtime.js
          grep -Fq "['ALTINKAYNAK',['USDTRY','EURTRY','GRAMTRY','GOLDUSD'],altinkaynak]" app/src/main/assets/runtime.js
          grep -Fq "['THEUNAT',['XU100','USDTRY','EURTRY','GOLDUSD'],theunat]" app/src/main/assets/runtime.js
          grep -Fq "['BISTCANLI',['XU100','USDTRY','EURTRY','GRAMTRY','GOLDUSD'],bistCanli]" app/src/main/assets/runtime.js
          grep -Fq "const missing=covers.filter(k=>!complete(k))" app/src/main/assets/runtime.js
          grep -Fq "if(KEYS.every(k=>complete(k)))break" app/src/main/assets/runtime.js
          grep -Fq "'static.altinkaynak.com'" app/src/main/assets/native-market-http.js
          grep -Fq "const complete=k=>fields[k]?.value!=null&&Number.isFinite(Number(fields[k]?.changePct))" app/src/main/assets/runtime.js
          grep -Fq "else if(fields[k]&&!complete(fields[k])&&complete(old[k]))fields[k]={...old[k],stale:true}" app/src/main/assets/runtime.js
          grep -Fq "'theunat.com'" app/src/main/assets/native-market-http.js
          grep -Fq "'borsaistanbulcanli.com'" app/src/main/assets/native-market-http.js
          grep -Fq "web-paragaranti-pubsub.foreks.com" app/src/main/assets/runtime.js
          grep -Fq "www.tcmb.gov.tr/kurlar/today.xml" app/src/main/assets/runtime.js
          grep -Fq "FINANCE_PORTAL_CACHE" app/src/main/assets/runtime.js
          grep -Fq "renderCached:()=>{const c=load();return c?render(c):''}" app/src/main/assets/runtime.js
          grep -Fq "portalHtml=globalThis.AurumNewsPortal?.renderCached?.()||''" app/src/main/assets/runtime.js
          ! grep -Fq "Birleştirilmiş finans portalı hazırlanıyor…" app/src/main/assets/runtime.js
          grep -Fq "BUY_SELL_SAFETY_GATE" app/src/main/assets/runtime.js
          grep -Fq "ms.put(tableState);ms.put(selectionSnapshot);ms.put(auditRow)" app/src/main/assets/runtime.js
          grep -Fq "S_ATOMIC_META_TX_FAILED" app/src/main/assets/runtime.js
          grep -Fq "state.db.transaction('meta','readwrite')" app/src/main/assets/runtime.js
          grep -Fq "S_ATOMIC_META_TX_ABORTED" app/src/main/assets/runtime.js
          grep -Fq "state.selection=nextSelection" app/src/main/assets/runtime.js
          grep -Fq "const qev=await globalThis.AurumQualifiedBuySell?.advance?.(job)" app/src/main/assets/runtime.js
          grep -Fq "await globalThis.AurumPortfolio?.reconcile?.()" app/src/main/assets/runtime.js
          ! grep -Fq "try{mark();await save();refreshVisible()}" app/src/main/assets/runtime.js
          ! grep -Fq "r62CalculateS" app/src/main/assets/runtime.js
          grep -Fq "add('S_EFFECTIVE_OWNER'" app/src/main/assets/runtime.js
          grep -Fq "add('S_PORTFOLIO_RECONCILE'" app/src/main/assets/runtime.js
          grep -Fq "throw new Error('Executable runtime update devre dışı; yeni kod yalnız imzalı APK/AAB ile dağıtılır')" app/src/main/assets/runtime.js
          grep -Fq "FAST_NAV_CACHE" app/src/main/assets/runtime.js
          grep -Fq "Sorunları Gider ve Tekrar Doğrula" app/src/main/assets/runtime.js
          grep -Fq "if(open.has('FAST_PARALLEL_TRANSFER')||open.has('BACKGROUND_STAGING_QUEUE'))await r73FastTransferRepair()" app/src/main/assets/runtime.js
          ! grep -Fq "open=new Set((before.issues||[]).map(x=>x.id));await r73FastTransferRepair()" app/src/main/assets/runtime.js
          grep -Fq "✓ ONARILDI" app/src/main/assets/runtime.js
          grep -Fq "ACCURACY_" app/src/main/assets/runtime.js
          ! grep -Fq '${accuracySettingsModule()}${tableAuditSettingsModule()}' app/src/main/assets/runtime.js
          ! grep -Fq 'globalThis.rev20UserRepairModule?.()' app/src/main/assets/runtime.js
          ! grep -Fq 'globalThis.rev20UserRepairModule=' app/src/main/assets/runtime.js
          grep -Fq "runRepairCenter('NATIVE')" app/src/main/assets/runtime.js
          grep -Fq "runRepairCenter('UI')" app/src/main/assets/runtime.js
          grep -Fq "runRepairCenter('SETTINGS')" app/src/main/assets/runtime.js
          grep -Fq "runRepairCenter('FOLDER')" app/src/main/assets/runtime.js
          grep -Fq "incremental:true,changedSymbols:changed.map(x=>x.sym)" app/src/main/assets/runtime.js
          ! grep -q "refreshMarketIndicators(),mode!='LIVE'" app/src/main/assets/runtime.js
          ! grep -q "await refreshMarket('DATA_COMMAND')" app/src/main/assets/runtime.js
          ! grep -q "prepareGeneralDataR47" app/src/main/assets/runtime.js
          ! grep -q "prepareMissingDataR47" app/src/main/assets/runtime.js
          ! grep -q "calculateKnR47" app/src/main/assets/runtime.js
          grep -q "FIRST_VERIFIED_DATA_FROM_NEW_TRADING_DAY" app/src/main/assets/runtime.js
          grep -q "calcRecords.length<20" app/src/main/assets/runtime.js
          grep -q "fillOk=fillPct>=70" app/src/main/assets/runtime.js
          grep -q "derivationSuppressed=true" app/src/main/assets/runtime.js
          grep -Fq "assertFalse(hasAlarm(\"03:17\"))" app/src/androidTest/java/com/aurum/bistterminal8/NativeSchedulerAcceptanceTest.kt
          grep -Fq "foregroundLaunchDoesNotMutateSchedulerConfiguration" app/src/androidTest/java/com/aurum/bistterminal8/NativeSchedulerAcceptanceTest.kt
          test "$(grep -Fxc "bootstrapClean();" app/src/main/assets/runtime.js)" -eq 1
          tail -n 5 app/src/main/assets/runtime.js | grep -Fq "bootstrapClean();"
          grep -q "closest?.('.aurum-r209-market-refresh')" app/src/main/assets/rev20-final-rules.js
          ! grep -q '#refreshBtn,\[data-action="refresh"\],.refresh-btn' app/src/main/assets/rev20-final-rules.js
      - name: Live provider diagnostics
        continue-on-error: true
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          curl --fail --silent --show-error --max-time 20 -A "$UA" 'https://api.genelpara.com/embed/doviz.json' -o /tmp/genelpara.json
          GP=$?
          curl --fail --silent --show-error --max-time 20 -A "$UA" 'https://query1.finance.yahoo.com/v8/finance/chart/XU100.IS?range=1d&interval=5m&includePrePost=false' -o /tmp/yahoo.json || curl --fail --silent --show-error --max-time 20 -A "$UA" 'https://query2.finance.yahoo.com/v8/finance/chart/XU100.IS?range=1d&interval=5m&includePrePost=false' -o /tmp/yahoo.json
          YH=$?
          curl --fail --silent --show-error --max-time 20 -A "$UA" 'https://static.altinkaynak.com/public/Currency' -o /tmp/altinkaynak.json
          AK=$?
          grep -q '"Kod":"USD"' /tmp/altinkaynak.json
          curl --fail --silent --show-error --max-time 20 -A "$UA" 'https://theunat.com/markets' -o /tmp/theunat.html
          TU=$?
          grep -qi 'BIST 100' /tmp/theunat.html
          echo "genelpara_exit=$GP yahoo_chart_exit=$YH altinkaynak_exit=$AK theunat_exit=$TU"
          test "$YH" -eq 0
          test "$AK" -eq 0
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            set -e
            test -f app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.aurum.rev20.smartfastx.debug
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 8
            adb shell pidof com.aurum.rev20.smartfastx.debug
            adb shell dumpsys alarm > /tmp/alarm.txt
            # Scheduler ownership is asserted by NativeSchedulerAcceptanceTest; dumpsys is retained as evidence only.
            adb shell input keyevent 3
            sleep 2
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 4
            adb shell am force-stop com.aurum.rev20.smartfastx.debug
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 4
            adb shell pidof com.aurum.rev20.smartfastx.debug
            adb logcat -d | tee /tmp/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL' /tmp/logcat.txt
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance
          path: |
            app/build/outputs/apk/debug/*.apk
            /tmp/alarm.txt
            /tmp/logcat.txt
            /tmp/genelpara.json
            /tmp/yahoo.json
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
