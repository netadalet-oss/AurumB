name: Runtime Acceptance
on:
  push:
    branches: [ stabilization-runtime-acceptance ]
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Static runtime invariants
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/rev20-final-rules.js
          ! grep -q "indicatorPromise=refreshMarketIndicators()" app/src/main/assets/runtime.js
          ! grep -q "refreshMarketIndicators(),mode!='LIVE'" app/src/main/assets/runtime.js
          ! grep -q "await refreshMarket('DATA_COMMAND')" app/src/main/assets/runtime.js
          grep -q "FIRST_VERIFIED_DATA_FROM_NEW_TRADING_DAY" app/src/main/assets/runtime.js
          grep -q "calcRecords.length<20" app/src/main/assets/runtime.js
      - name: Live provider reachability
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20 'https://api.genelpara.com/embed/doviz.json' -o /tmp/genelpara.json
          test -s /tmp/genelpara.json
          curl --fail --silent --show-error --max-time 20 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=XU100.IS,TRY=X,EURTRY=X,EURUSD=X,GC=F' -o /tmp/yahoo.json ||           curl --fail --silent --show-error --max-time 20 'https://query2.finance.yahoo.com/v7/finance/quote?symbols=XU100.IS,TRY=X,EURTRY=X,EURUSD=X,GC=F' -o /tmp/yahoo.json
          test -s /tmp/yahoo.json
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            adb install -r "$APK"
            adb shell am force-stop com.aurum.rev20.smartfastx.debug
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 8
            adb shell pidof com.aurum.rev20.smartfastx.debug
            adb shell dumpsys alarm > /tmp/alarm.txt
            grep -q 'com.aurum.rev20.smartfastx.debug' /tmp/alarm.txt
            adb shell input keyevent 3
            sleep 2
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 4
            adb shell am force-stop com.aurum.rev20.smartfastx.debug
            adb shell am start -W -n com.aurum.rev20.smartfastx.debug/com.aurum.bistterminal8.MainActivity
            sleep 4
            adb shell pidof com.aurum.rev20.smartfastx.debug
            adb logcat -d | tee /tmp/logcat.txt
            ! grep -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL' /tmp/logcat.txt
      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance
          path: |
            app/build/outputs/apk/debug/*.apk
            /tmp/alarm.txt
            /tmp/logcat.txt
            /tmp/genelpara.json
            /tmp/yahoo.json
