name: Rescue Four Exact-Head Builds

on:
  push:
    branches: [ rescue-four-builds-20261005 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: native-build-${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: aurumb
            sha: 7110c1103e84b747a20289fe140c7ff11173108f
            artifact: AurumB-native-exact-head
          - product: aurumf
            sha: 4836c9dffa3791efe79a768faf2383cb0798b686
            artifact: AurumF-native-exact-head
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netadalet-oss/Aurum
          ref: ${{ matrix.sha }}
          path: src
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact source SHA
        working-directory: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          printf 'repository=netadalet-oss/Aurum\nproduct=%s\nsha=%s\n' "${{ matrix.product }}" "${{ matrix.sha }}" > exact-head-provenance.txt
      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Full deterministic verification and build
        working-directory: src
        run: |
          set -euo pipefail
          gradle --no-daemon :core:domainChecks
          gradle --no-daemon :core:test :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
          gradle --no-daemon :app:assembleDebugAndroidTest
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > exact-head-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src/exact-head-provenance.txt
            src/exact-head-checksums.sha256
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/apk/release/*.apk
            src/app/build/outputs/apk/androidTest/debug/*.apk
            src/app/build/reports/
            src/app/build/test-results/
            src/core/build/reports/
            src/core/build/test-results/
          if-no-files-found: error
          retention-days: 30

  native-smoke:
    name: native-smoke-${{ matrix.product }}-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: aurumb
            sha: 7110c1103e84b747a20289fe140c7ff11173108f
            api: 26
          - product: aurumb
            sha: 7110c1103e84b747a20289fe140c7ff11173108f
            api: 35
          - product: aurumf
            sha: 4836c9dffa3791efe79a768faf2383cb0798b686
            api: 26
          - product: aurumf
            sha: 4836c9dffa3791efe79a768faf2383cb0798b686
            api: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netadalet-oss/Aurum
          ref: ${{ matrix.sha }}
          path: src
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact source SHA
        working-directory: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - name: Install emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-35" "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - name: Create and boot emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/rescue-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name rescue-ci --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --path "$ANDROID_AVD_HOME/rescue-ci.avd"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ACCEL=auto; else ACCEL=off; fi
          "$ANDROID_HOME/emulator/emulator" -avd rescue-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel "$ACCEL" > "$RUNNER_TEMP/rescue-emulator.log" 2>&1 &
          timeout 90s "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/rescue-emulator.log"
          exit 1
      - name: Run native device tests
        working-directory: src
        run: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Verify native UI evidence
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/build/outputs/connected_android_test_additional_output")
          screenshots=list(root.rglob("*.png"))
          layouts=list(root.rglob("*.json"))
          assert len(screenshots)>=18, f"Missing native screenshots: {len(screenshots)}"
          assert len(layouts)>=9, f"Missing native layout records: {len(layouts)}"
          print(f"Evidence: {len(screenshots)} screenshots, {len(layouts)} layout records")
          PY
      - name: Capture diagnostics
        if: failure()
        run: |
          timeout 20s "$ANDROID_HOME/platform-tools/adb" logcat -d -t 1500 || true
          cat "$RUNNER_TEMP/rescue-emulator.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-${{ matrix.product }}-api${{ matrix.api }}-evidence
          path: |
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/apk/androidTest/debug/*.apk
            src/app/build/outputs/androidTest-results/
            src/app/build/reports/androidTests/
            src/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

  legacy-b-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netadalet-oss/AurumB
          ref: 91404dd565a91aaa6c2f942c9bc7cb3497aaa81c
          path: src
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify and build exact Legacy B
        working-directory: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91404dd565a91aaa6c2f942c9bc7cb3497aaa81c"
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/features.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/scheduler-settings.js
          gradle --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          printf 'repository=netadalet-oss/AurumB\nsha=%s\n' "$(git rev-parse HEAD)" > exact-head-provenance.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > exact-head-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-AurumB-exact-head
          path: |
            src/exact-head-provenance.txt
            src/exact-head-checksums.sha256
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  legacy-f-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netadalet-oss/AurumF
          ref: b43ae36f603faba57b0a58b2fff4559776f936f3
          path: src
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify and build exact Legacy F
        working-directory: src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b43ae36f603faba57b0a58b2fff4559776f936f3"
          for f in native-bridge.js native-market-http.js core.js features.js runtime.js k-tarihsel.js netherlands-news-portal.js market-rebuilt.js trigger-contract.js scheduler-settings.js bist-market-summary.js; do node --check "app/src/main/assets/$f"; done
          node tests/regression-contracts.js
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/aurumf-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          AURUMF_DEBUG_STORE_FILE="$RUNNER_TEMP/aurumf-debug.keystore" AURUMF_DEBUG_STORE_PASSWORD=android AURUMF_DEBUG_KEY_ALIAS=androiddebugkey AURUMF_DEBUG_KEY_PASSWORD=android gradle --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          printf 'repository=netadalet-oss/AurumF\nsha=%s\n' "$(git rev-parse HEAD)" > exact-head-provenance.txt
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > exact-head-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-AurumF-exact-head
          path: |
            src/exact-head-provenance.txt
            src/exact-head-checksums.sha256
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
