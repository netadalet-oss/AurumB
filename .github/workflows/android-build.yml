name: Android Build
on:
  push:
    branches: [ main, full-system-repair-20260925 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate all JavaScript syntax
        run: |
          set -euo pipefail
          find app/src/main/assets -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run static runtime contract audit
        run: node scripts/audit-runtime.js

      - name: Compile and assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare persistent release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.AURUMB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURUMB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURUMB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURUMB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Persistent release signing secrets are not configured; no final installable APK will be published."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurumb-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/aurumb-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Align and sign installable APK with persistent key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AURUMB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURUMB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURUMB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$DEBUG_APK" app/build/outputs/apk/AurumB-final-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/aurumb-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --key-pass "pass:$KEY_PASSWORD"             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out app/build/outputs/apk/AurumB-final-install.apk             app/build/outputs/apk/AurumB-final-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/AurumB-final-install.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 app/build/outputs/apk/AurumB-final-install.apk

      - name: Upload compile-validation debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-debug-validation-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload persistently signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-final-installable-apk
          path: app/build/outputs/apk/AurumB-final-install.apk
