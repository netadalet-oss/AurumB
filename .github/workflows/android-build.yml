name: Android Build
on:
  push:
    branches: [ main, fix/legacy-standalone-integrity-20261008 , integrate/legacy-b-pending-safe-20261008 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/features.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/offline-first.js
          node --check app/src/main/assets/netherlands-news-portal.js
          node --check app/src/main/assets/scheduler-settings.js
          node --check app/src/main/assets/trigger-contract.js
          node --check app/src/main/assets/rev20-final-rules.js
          node --check app/src/main/assets/market-indicators-revision.js
          node --check app/src/main/assets/rev20-final-stability.js
          node --check app/src/main/assets/final-hardening.js
          node --check app/src/main/assets/native-market-http.js
          node --check app/src/main/assets/market-rebuilt.js
      - name: Confirm retained parked safety revisions
        run: node tests/pending-revisions-retained.test.js

      - name: Validate quality-gate contract
        run: |
          set -euo pipefail
          R=app/src/main/assets/runtime.js
          grep -F "threshold=fill>=100?100:fill>=95?95:fill>=90?90:fill>=80?80:fill>=70?70:null" "$R"
          grep -F "ladder:[100,95,90,80,70]" "$R"
          grep -F "derivedUpdateAllowed:ok" "$R"
          grep -F "DATA_FILL_BELOW_70_KEEP_LAST_VALID_SNAPSHOT" "$R"
          grep -F "READY_TO_PUBLISH:'READY_TO_PUBLISH'" "$R"
          grep -F "CANCELLED:'CANCELLED'" "$R"
          grep -F "STAGING:'STAGING'" "$R"
          grep -F "VALIDATING:'VALIDATING'" "$R"
          grep -F "applicationId 'com.aurum.nextrevised09'" app/build.gradle
          grep -F "const DB_NAME='bist_optimizasyon_r38_separate'" app/src/main/assets/core.js
          grep -F "const DB_VERSION=12" app/src/main/assets/core.js
          ! grep -R -F "indexedDB.deleteDatabase" app/src/main/assets
          grep -F "errorCount:0" "$R"
          grep -F "activeSnapshotId:activeMeta?.snapshotId||null" "$R"
          grep -F "targetSymbolCount:currentSymbols().length" "$R"
          grep -F "job.errorCount=Number(job.errorCount||0)+1" "$R"
          grep -F '"script.google.com", "script.googleusercontent.com"' app/src/main/java/com/aurum/bistterminal8/NativeMarketHttp.kt
          grep -F 'Regex("^/macros/s/[^/]+/exec$")' app/src/main/java/com/aurum/bistterminal8/NativeMarketHttp.kt
          grep -F 'SavedRelayPolicy.matches(context, url)' app/src/main/java/com/aurum/bistterminal8/NativeMarketHttp.kt
          grep -F 'object SavedRelayPolicy' app/src/main/java/com/aurum/bistterminal8/SavedRelayPolicy.kt
          grep -F '"relay_endpoint_set"' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F '"relay_endpoint_set"' app/src/main/java/com/aurum/bistterminal8/PipelineService.kt
          grep -F "relay_endpoint_set" "$R"
          grep -F "RELAY_ENDPOINT_NOT_REGISTERED" "$R"
          grep -F 'object OperationLock' app/src/main/java/com/aurum/bistterminal8/OperationLock.kt
          grep -F 'OperationLock.acquire(kind, owner)' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'OperationLock.acquire(kind, jobToken)' app/src/main/java/com/aurum/bistterminal8/PipelineService.kt
          grep -F 'class TransferKeepaliveService : Service()' app/src/main/java/com/aurum/bistterminal8/TransferKeepaliveService.kt
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' app/src/main/java/com/aurum/bistterminal8/TransferKeepaliveService.kt
          grep -F 'wakeLock?.let { if (it.isHeld) it.release() }' app/src/main/java/com/aurum/bistterminal8/TransferKeepaliveService.kt
          grep -F 'android:name="com.aurum.bistterminal8.TransferKeepaliveService"' app/src/main/AndroidManifest.xml
          grep -F 'ContextCompat.startForegroundService' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'ERR:EXACT_SETTINGS_UNAVAILABLE' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'editor.remove("next_" + kind + "_" + time.replace(":", ""))' app/src/main/java/com/aurum/bistterminal8/AurumScheduler.kt
          grep -F 'Kesin alarm izin ekranı açılamadı' app/src/main/assets/scheduler-settings.js
          grep -F 'operation_lock_acquire&owner=' "$R"
          grep -F "operation_lock_acquire',{kind:'market',owner}" app/src/main/assets/trigger-contract.js
          grep -F "globalThis.AurumMarketModuleRefresh=()=>market(true)" app/src/main/assets/trigger-contract.js
          grep -F "await market(true)" app/src/main/assets/trigger-contract.js
          grep -F "Orphan staging aktif tabloya yayınlanmadı" "$R"
          grep -F "AURUM_BACKGROUND_PIPELINE=new URLSearchParams(location.search).get('pipeline')||'data'" "$R"
          grep -F "if(!BACKGROUND_SYNC||AURUM_BACKGROUND_PIPELINE==='market')return false" "$R"
          grep -F "if(BACKGROUND_SYNC&&AURUM_BACKGROUND_PIPELINE==='market')" "$R"
          ! grep -F "PROFILE_SKIP" "$R"
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('app/src/main/assets/runtime.js','utf8');const a=s.indexOf('async function recoverOrphanStagingRecords(){'),b=s.indexOf('\nasync function atomicPublish(job,universe){',a);const body=s.slice(a,b);if(/objectStore\(['\"]records['\"]\)|dbPut\(['\"]records['\"]/.test(body)){throw new Error('orphan staging must not write active records')}
          NODE
          grep -F "R221_SMART_MAX_ROUNDS=5" "$R"
          grep -F "R225_FILL_TARGETS=Object.freeze([100,95,90,80,70])" "$R"
          grep -F "for(let round=1;round<=5;round++)" "$R"
          grep -F "ATOMIC_PUBLISH_ONLY_IF_FRESH_CANDIDATE_FILL_GTE_70" "$R"
          grep -F "if(source?.calculationEligible===false)continue" "$R"
          grep -F "await refreshTableMeta();" "$R"
          grep -F "__AURUM_REV2044_PUBLICATION_CONTINUITY" "$R"
          grep -F "AurumQualifiedBuySell?.advance?.(job)" "$R"
          grep -F "AurumPortfolio?.reconcile?.('S_PUBLISHED')" "$R"
          grep -F "__AURUM_R245_FOREGROUND_PUBLICATION_OBSERVER" app/src/main/assets/final-hardening.js
          grep -F "STARTUP_AFTER_LOADSTATE" app/src/main/assets/final-hardening.js
          grep -F "VISIBLE_POLL" app/src/main/assets/final-hardening.js
          grep -F "AurumPublicationContinuity?.reload" app/src/main/assets/final-hardening.js
          grep -F "state.selectionDisplaySnapshot=" "$R"
          grep -F "state.knDisplaySnapshot=" "$R"
          grep -F "const retryDelays=[5000,15000,45000]" "$R"
          grep -F "WAITING_FOR_NETWORK_RETRY_EXHAUSTED" "$R"
          grep -F "PublicationBus.publish()" app/src/main/java/com/aurum/bistterminal8/PipelineService.kt
          grep -F "AurumPublicationContinuity.reload" app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F "object PublicationBus" app/src/main/java/com/aurum/bistterminal8/PublicationBus.kt
          grep -F "ensureNativeParity('STARTUP')" app/src/main/assets/scheduler-settings.js
          grep -F "val rearmAfter = maxOf(Instant.now(), Instant.ofEpochMilli(epoch).plusSeconds(1))" app/src/main/java/com/aurum/bistterminal8/TriggerReceiver.kt
          grep -F "state.selectionDisplaySnapshot=" app/src/main/assets/core.js
          grep -F "state.knDisplaySnapshot=" app/src/main/assets/core.js
          grep -F '"notification" -> {' app/src/main/java/com/aurum/bistterminal8/PipelineService.kt
          grep -F "const requiredByFill=nextRound===1?fill<100:fill<target" "$R"
          grep -F "if(age>COHORT_MS)" "$R"
          grep -F '"schedule_status" -> AurumScheduler.statusJson(this)' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'fun exactAllowed' app/src/main/java/com/aurum/bistterminal8/AurumScheduler.kt
          grep -F 'recordTransfer=(state.records||[])' "$R"
          grep -F "let MANUAL_DATA_LOCK=false" "$R"
          grep -F "job.operationType='REPAIR'" "$R"
          ! grep -F "await refreshMarket('DATA_COMMAND')" "$R"
          grep -F "Sağlık / Süreklilik" app/src/main/assets/scheduler-settings.js
          grep -F "Salt okunur" app/src/main/assets/scheduler-settings.js
          grep -F "__aurumHistory20Bridged" app/src/main/assets/scheduler-settings.js
          # K_Tarihsel functional contract: preserve T1-T30 source runs and automatic archive state.
          grep -F "30 distinct trading dates" app/src/main/assets/core.js
          grep -F "seenDates.size<30" app/src/main/assets/core.js
          grep -F "khArchive:{schema:1,live:null,rows:[]}" app/src/main/assets/core.js
          grep -F "globalThis.showAurumNotice=function" app/src/main/assets/scheduler-settings.js
          grep -F "globalThis.log=async function" app/src/main/assets/scheduler-settings.js
          grep -F "if (u.protocol !== 'https:') return false;" app/src/main/assets/offline-first.js
          grep -F "/^([01]\\d|2[0-3]):[0-5]\\d$/" app/src/main/assets/scheduler-settings.js
          ! grep -F "/^([01]\\\\d|2[0-3]):[0-5]\\\\d$/" app/src/main/assets/scheduler-settings.js
          ! grep -F "c=Number(x.changePct)" "$R"
          ! grep -F "p=x.stale?null:Number(x.changePct)" "$R"
          ! grep -F "Number.isFinite(Number(x.changePct))" "$R"
          # K_Tarihsel T1-T30/backfill + automatic archive regression lock
          grep -F "const HISTORY_30_LEGACY_KIND='BACKFILL_K_TARIHSEL_30D';" "$R"
          grep -F "async function archiveHistorical(job)" "$R"
          grep -F "await kh117AdvanceArchive(kh117T0())" "$R"
          grep -F "historyTableFingerprint()" "$R"
          # Final signing is secret-backed below; no throwaway key generation is permitted.
      - name: Verify Legacy restore recovery and secure native command surfaces
        run: |
          set -euo pipefail
          node tests/legacy-restore-atomicity.test.js
          ! grep -R -F 'addJavascriptInterface(' app/src/main/java
          ! grep -R -F '@JavascriptInterface' app/src/main/java
          grep -F 'ERR:UNTRUSTED_ORIGIN' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'ERR:UNTRUSTED_ORIGIN' app/src/main/java/com/aurum/bistterminal8/PipelineService.kt
          grep -F 'if(epoch!=expected)return' app/src/main/java/com/aurum/bistterminal8/TriggerReceiver.kt
          grep -F 'if(!committed)created?.let' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'android:exported="true"' app/src/main/AndroidManifest.xml

      - name: Full Android verification
        run: |
          gradle --no-daemon clean \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            :app:mergeDebugResources \
            :app:processDebugMainManifest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:testDebugUnitTest \
            :app:lintDebug \
            --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload Gradle-signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-gradle-signed-installable
          path: app/build/outputs/apk/debug/*.apk
      - name: Align and sign installable APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AURUMB_KEYSTORE_B64: ${{ secrets.AURUMB_KEYSTORE_B64 }}
          AURUMB_KEYSTORE_PASSWORD: ${{ secrets.AURUMB_KEYSTORE_PASSWORD }}
          AURUMB_KEY_ALIAS: ${{ secrets.AURUMB_KEY_ALIAS }}
          AURUMB_KEY_PASSWORD: ${{ secrets.AURUMB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)"
          test -n "$UNSIGNED" && test -f "$UNSIGNED" || { echo "Unsigned release APK not found"; exit 1; }
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/AurumB-final-aligned.apk
          if [[ -z "$AURUMB_KEYSTORE_B64" || -z "$AURUMB_KEYSTORE_PASSWORD" || -z "$AURUMB_KEY_ALIAS" || -z "$AURUMB_KEY_PASSWORD" ]]; then
            echo "::error::Persistent signing keystore secrets are not configured. Update-compatible final APK cannot be produced."
            exit 1
          fi
          printf '%s' "$AURUMB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aurumb-final.jks"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurumb-final.jks" --ks-key-alias "$AURUMB_KEY_ALIAS" --ks-pass "pass:$AURUMB_KEYSTORE_PASSWORD" --key-pass "pass:$AURUMB_KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/AurumB-final-install.apk app/build/outputs/apk/AurumB-final-aligned.apk
          VERIFY_OUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/AurumB-final-install.apk)"
          printf '%s\n' "$VERIFY_OUT"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUT" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')"
          EXPECTED_SHA256="150a61d5f6a45b7f8caa10dc62d4944c781aad3e08e6323cc45df3fda935b7e4"
          test "$CERT_SHA256" = "$EXPECTED_SHA256" || { echo "Signing certificate does not match installed AurumB APK"; exit 1; }
          "$BUILD_TOOLS/zipalign" -c -p 4 app/build/outputs/apk/AurumB-final-install.apk
      - name: Upload aligned APK for controlled signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-aligned-for-signing
          path: app/build/outputs/apk/AurumB-final-aligned.apk
          if-no-files-found: error
      - name: Upload APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-final-installable-apk
          path: app/build/outputs/apk/AurumB-final-install.apk
          if-no-files-found: error

  legacy-fresh-release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/fix/legacy-standalone-integrity-20261008' || github.ref == 'refs/heads/integrate/legacy-b-pending-safe-20261008')
    needs: [assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.AURUMB_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.AURUMB_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.AURUMB_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.AURUMB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Legacy fresh-install signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurumb-legacy"
          KEYSTORE="$RUNNER_TEMP/aurumb-legacy/legacy-release.keystore"
          META="$RUNNER_TEMP/aurumb-legacy/legacy-release-key.txt"
          present=0
          for v in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!v}" ] && present=$((present+1))
          done
          # New integration APKs must NEVER silently rotate their signing key.
          if [ "$GITHUB_REF" = "refs/heads/integrate/legacy-b-pending-safe-20261008" ] && [ "$present" -ne 4 ]; then
            echo "::error::Existing release signing secrets required; refusing new identity"
            exit 1
          fi
          if [ "$present" -eq 4 ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            MODE=existing
          elif [ "$present" -eq 0 ]; then
            RELEASE_STORE_PASSWORD="$(openssl rand -hex 24)"
            RELEASE_KEY_PASSWORD="$(openssl rand -hex 24)"
            RELEASE_KEY_ALIAS="aurumb-legacy"
            keytool -genkeypair -v -storetype JKS -keystore "$KEYSTORE" \
              -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
              -keypass "$RELEASE_KEY_PASSWORD" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=AurumB Legacy Release,O=AurumB,C=TR"
            MODE=bootstrap
          else
            echo "::error::Partial signing secret configuration";exit 1
          fi
          CERT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          {
            echo "AURUMB_LEGACY_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "AURUMB_LEGACY_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "AURUMB_LEGACY_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "AURUMB_LEGACY_CERT_SHA256=$CERT"
            echo "AURUMB_LEGACY_MODE=$MODE"
          } > "$META"
          chmod 600 "$KEYSTORE" "$META"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "meta=$META" >> "$GITHUB_OUTPUT"
          echo "store_password=$RELEASE_STORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_password=$RELEASE_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "alias=$RELEASE_KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Build standalone Legacy release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Align, sign and verify standalone Legacy APK
        shell: bash
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
          STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
          KEY_ALIAS: ${{ steps.signing.outputs.alias }}
          EXPECTED_CERT: ${{ steps.signing.outputs.cert }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -1)"
          test -s "$UNSIGNED"
          OUT=app/build/outputs/apk/release/AurumB-Legacy-R38-fresh-install.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aurumb-legacy-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out "$OUT" "$RUNNER_TEMP/aurumb-legacy-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee "$RUNNER_TEMP/apksigner-legacy-b.txt"
          ACTUAL="$(sed -n -E 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-legacy-b.txt" | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED_CERT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | tee "$RUNNER_TEMP/badging-legacy-b.txt"
          grep -F "package: name='com.aurum.nextrevised09' versionCode='123' versionName='2.0.0-r38-separate-economic'" "$RUNNER_TEMP/badging-legacy-b.txt"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/AurumB-Legacy-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AurumB-Legacy-signed-fresh-candidate
          path: |
            app/build/outputs/apk/release/AurumB-Legacy-R38-fresh-install.apk
            ${{ runner.temp }}/AurumB-Legacy-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Back up newly bootstrapped signing key
        if: always() && steps.signing.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-Legacy-key-BACKUP
          path: |
            ${{ steps.signing.outputs.keystore }}
            ${{ steps.signing.outputs.meta }}
          if-no-files-found: error
          retention-days: 7
