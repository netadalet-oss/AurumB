name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle wrapper
        run: |
          chmod +x gradlew
          echo "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          grep -F "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -F "distributionSha256Sum=d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab" gradle/wrapper/gradle-wrapper.properties
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/features.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/offline-first.js
          node --check app/src/main/assets/netherlands-news-portal.js
          node --check app/src/main/assets/scheduler-settings.js
          node --check app/src/main/assets/trigger-contract.js
          node --check app/src/main/assets/rev20-final-rules.js
          node --check app/src/main/assets/market-indicators-revision.js
          node --check app/src/main/assets/rev20-final-stability.js
          node --check app/src/main/assets/final-hardening.js
          node --check app/src/main/assets/native-market-http.js
          node --check app/src/main/assets/market-rebuilt.js
      - name: Validate quality-gate contract
        run: |
          set -euo pipefail
          R=app/src/main/assets/runtime.js
          grep -F "threshold=fill>=95?95:fill>=90?90:fill>=80?80:fill>=70?70:null" "$R"
          grep -F "ladder:[95,90,80,70]" "$R"
          grep -F "derivedUpdateAllowed:ok" "$R"
          grep -F "Valid Veriler snapshots publish regardless of fill" "$R"
          ! grep -F "DATA_FILL_BELOW_70_KEEP_LAST_VALID_SNAPSHOT" app/src/main/assets/final-hardening.js
          grep -F "R221_SMART_MAX_ROUNDS=5" "$R"
          grep -F "R225_FILL_TARGETS=Object.freeze([100,95,90,80,70])" "$R"
          grep -F "const requiredByFill=nextRound===1?fill<100:fill<target" "$R"
          grep -F "if(age>COHORT_MS)" "$R"
          grep -F '"schedule_status" -> AurumScheduler.statusJson(this)' app/src/main/java/com/aurum/bistterminal8/MainActivity.kt
          grep -F 'fun exactAllowed' app/src/main/java/com/aurum/bistterminal8/AurumScheduler.kt
          grep -F 'recordTransfer=(state.records||[])' "$R"
          grep -F "canonical:'AurumQualifiedBuySell'" "$R"
          grep -F "globalThis.AurumQualifiedBuySell=Object.freeze" "$R"
          # Final signing is secret-backed below; no throwaway key generation is permitted.
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Assemble release APK
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Align and sign installable APK
        env:
          AURUMB_KEYSTORE_B64: ${{ secrets.AURUMB_KEYSTORE_B64 }}
          AURUMB_KEYSTORE_PASSWORD: ${{ secrets.AURUMB_KEYSTORE_PASSWORD }}
          AURUMB_KEY_ALIAS: ${{ secrets.AURUMB_KEY_ALIAS }}
          AURUMB_KEY_PASSWORD: ${{ secrets.AURUMB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "Release APK not found: $UNSIGNED"; exit 1; }
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/AurumB-final-aligned.apk
          test -n "$AURUMB_KEYSTORE_B64" || { echo "Persistent signing keystore required"; exit 1; }
          test -n "$AURUMB_KEYSTORE_PASSWORD" || { echo "Signing keystore password required"; exit 1; }
          test -n "$AURUMB_KEY_ALIAS" || { echo "Signing key alias required"; exit 1; }
          test -n "$AURUMB_KEY_PASSWORD" || { echo "Signing key password required"; exit 1; }
          printf '%s' "$AURUMB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aurumb-final.jks"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurumb-final.jks" --ks-key-alias "$AURUMB_KEY_ALIAS" --ks-pass "pass:$AURUMB_KEYSTORE_PASSWORD" --key-pass "pass:$AURUMB_KEY_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/AurumB-final-install.apk app/build/outputs/apk/AurumB-final-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/AurumB-final-install.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 app/build/outputs/apk/AurumB-final-install.apk
      - name: Upload aligned APK for controlled signing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-aligned-for-signing
          path: app/build/outputs/apk/AurumB-final-aligned.apk
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-final-installable-apk
          path: app/build/outputs/apk/AurumB-final-install.apk
