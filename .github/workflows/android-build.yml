name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate JavaScript syntax
        run: |
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/features.js
          node --check app/src/main/assets/runtime.js
          node --check app/src/main/assets/offline-first.js
          node --check app/src/main/assets/rev20-customization.js
          node --check app/src/main/assets/rev20-final-rules.js
          node --check app/src/main/assets/market-indicators-revision.js
          node --check app/src/main/assets/rev20-final-stability.js
          node --check app/src/main/assets/native-market-http.js
          node --check app/src/main/assets/market-rebuilt.js

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Align and sign installable APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/AurumB-final-aligned.apk
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/aurumb-final.jks" -storepass AurumB2026 -keypass AurumB2026 -alias aurumb -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AurumB Final,O=AurumB,C=TR"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurumb-final.jks" --ks-key-alias aurumb --ks-pass pass:AurumB2026 --key-pass pass:AurumB2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/AurumB-final-install.apk app/build/outputs/apk/AurumB-final-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/AurumB-final-install.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 app/build/outputs/apk/AurumB-final-install.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AurumB-final-installable-apk
          path: app/build/outputs/apk/AurumB-final-install.apk
