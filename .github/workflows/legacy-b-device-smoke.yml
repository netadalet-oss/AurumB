name: Legacy AurumB Device Smoke
on:
  push:
    branches: [ verify/legacy-b-device-20261008 ]
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build exact standalone Legacy AurumB debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Android 35 offline/foreground/background smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          script: |
            set -eu
            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
            test -s "$APK"
            adb wait-for-device
            timeout 240 sh -c 'stable=0; while [ "$stable" -lt 8 ]; do adb wait-for-device; if adb shell service check package 2>/dev/null | grep -q found && adb shell service check activity 2>/dev/null | grep -q found && adb shell cmd package list packages >/dev/null 2>&1; then stable=$((stable+1)); else stable=0; fi; sleep 5; done'
            adb logcat -c
            adb install -r "$APK"
            PACKAGE=com.aurum.nextrevised09
            CLASS=com.aurum.bistterminal8.MainActivity
            adb shell pm path "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/$CLASS"
            sleep 10
            adb shell pidof "$PACKAGE"
            adb shell am force-stop "$PACKAGE"
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am start -W -n "$PACKAGE/$CLASS"
            sleep 8
            adb shell pidof "$PACKAGE"
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell am start -W -n "$PACKAGE/$CLASS"
            sleep 5
            adb shell pidof "$PACKAGE"
            ! adb logcat -d | grep -A10 -B3 -E 'Process: com\.aurum\.nextrevised09|FATAL EXCEPTION' | grep -q "Process: $PACKAGE"
